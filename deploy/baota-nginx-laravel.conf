# 宝塔 Nginx + Laravel
#
# 若浏览器出现纯文字「404 Not Found / nginx」，说明请求未进入 Laravel。

# ============================================================
# 伪静态（网站 → 设置 → 伪静态）
# ============================================================

# --- 静态资源长缓存（PageSpeed）---
# 开关：.env 中 STATIC_ASSET_CACHE_ENABLED=true
# 生效条件：public/.static-asset-cache-on 文件存在（php artisan static-cache:sync）
# 未开启时仍正常返回文件，只是不加长缓存头
location ~* \.(?:css|js|mjs|map|jpg|jpeg|png|gif|ico|svg|webp|avif|bmp|woff|woff2|ttf|otf|eot|mp4|webm|mp3|pdf)$ {
    set $static_asset_cache "";
    if (-f $document_root/.static-asset-cache-on) {
        set $static_asset_cache "1";
    }
    if ($static_asset_cache = "1") {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# 不要在伪静态里再写 location ~ \.php$（会和面板冲突）

# ============================================================
# 网站目录
# ============================================================
# 运行目录：/public
# PHP 版本：按实际选择（如 8.1）

# ============================================================
# 配置文件（网站 → 设置 → 配置文件）
# ============================================================
# root .../public;
# include enable-php-81.conf;
#
# 注释掉：
# error_page 404 /404.html;
# error_page 404 =404 /404.html;
#
# PHP 段加上：
# fastcgi_intercept_errors off;
#
# 若手写 fastcgi（一般不必），socket 为：
# fastcgi_pass unix:/tmp/php-cgi-81.sock;

# ============================================================
# 静态缓存开关（SSH）
# ============================================================
# cd /www/wwwroot/你的站点
# 编辑 .env：STATIC_ASSET_CACHE_ENABLED=true
# /www/server/php/81/bin/php artisan static-cache:sync
# /www/server/php/81/bin/php artisan config:clear
#
# 确认 public/.static-asset-cache-on 已生成后，浏览器强刷验证响应头：
# Cache-Control: public, max-age=31536000, immutable

# ============================================================
# SSH 清缓存
# ============================================================
# cd /www/wwwroot/你的站点
# /www/server/php/81/bin/php artisan optimize:clear
# /www/server/php/81/bin/php artisan config:cache
